<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>핑퐁 핑퐁 구구단 모험 🌟</title>
  <meta name="description" content="초등학교 2학년 친구들을 위한 신나고 재미있는 구구단 학습 앱!">
  <style>
    /* ========== 글로벌 스타일 & 파스텔 테마 ========== */
    :root {
      --bg-gradient: linear-gradient(135deg, #FFF9E6 0%, #E8F5E9 50%, #E0F2FE 100%);
      --card-bg: #FFFFFF;
      --primary: #FF7043;
      --primary-hover: #F4511E;
      --secondary: #42A5F5;
      --accent-yellow: #FFD54F;
      --accent-green: #66BB6A;
      --accent-purple: #AB47BC;
      --text-main: #37474F;
      --text-muted: #78909C;
      --border-radius: 28px;
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.08);
      --shadow-button: 0 6px 0px rgba(0, 0, 0, 0.12);
      --font-family: 'Pretendard', 'NanumSquareRound', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* 앱 메인 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 520px;
      min-height: 640px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      border: 4px solid #FFE082;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 상단 유틸리티 바 (음향 토글 등) */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 10px;
    }

    .icon-btn {
      background: #F5F5F5;
      border: 2px solid #E0E0E0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: #EEEEEE;
      transform: scale(1.08);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* 화면 전환 공통 */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 10px 24px 28px;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 텍스트 스타일 */
    .title-large {
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      color: #FF6F00;
      text-shadow: 2px 2px 0px #FFE082;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ===================================================
       [화면 1] 단 선택 화면
       =================================================== */
    .step-badge {
      align-self: center;
      background: #FFF3E0;
      color: #E65100;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 2px dashed #FFB74D;
    }

    .dan-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .dan-btn {
      background: #FAFAFA;
      border: 3px solid #E0E0E0;
      border-radius: 20px;
      padding: 14px 6px;
      font-size: 20px;
      font-weight: 800;
      color: #546E7A;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 #CFD8DC;
    }

    .dan-btn .dan-icon {
      font-size: 24px;
    }

    .dan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #CFD8DC;
    }

    .dan-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #CFD8DC;
    }

    .dan-btn.selected {
      background: #FFF8E1;
      border-color: #FFA000;
      color: #E65100;
      box-shadow: 0 5px 0 #FFB300;
      transform: translateY(-3px) scale(1.03);
    }

    /* 랜덤 믹스 버튼 */
    .random-btn {
      width: 100%;
      background: #EDE7F6;
      border: 3px solid #BA68C8;
      border-radius: 20px;
      padding: 14px;
      font-size: 19px;
      font-weight: 800;
      color: #6A1B9A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      box-shadow: 0 5px 0 #AB47BC;
      transition: all 0.2s ease;
    }

    .random-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #AB47BC;
    }

    .random-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #AB47BC;
    }

    .random-btn.selected {
      background: #D1C4E9;
      border-color: #8E24AA;
      box-shadow: 0 5px 0 #7B1FA2;
      transform: translateY(-2px) scale(1.02);
    }

    /* 큰 시작 버튼 */
    .start-btn {
      margin-top: auto;
      background: linear-gradient(135deg, #FF7043, #FF5722);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 18px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #D84315, 0 12px 20px rgba(255, 87, 34, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #D84315, 0 14px 22px rgba(255, 87, 34, 0.4);
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #D84315;
    }

    /* ===================================================
       [화면 2] 문제 풀이 화면
       =================================================== */
    .quiz-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .quiz-progress-text {
      font-size: 17px;
      font-weight: 800;
      color: #546E7A;
      background: #ECEFF1;
      padding: 6px 14px;
      border-radius: 16px;
    }

    .star-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFF8E1;
      border: 2px solid #FFE082;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 900;
      color: #FF8F00;
    }

    .star-counter .star-icon {
      font-size: 22px;
      display: inline-block;
      animation: pulseStar 1.8s infinite ease-in-out;
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2) rotate(10deg); }
    }

    /* 프로그레스 바 */
    .progress-track {
      width: 100%;
      height: 12px;
      background: #ECEFF1;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #42A5F5, #66BB6A);
      border-radius: 10px;
      transition: width 0.4s ease-out;
    }

    /* 문제 카드 */
    .question-card {
      background: linear-gradient(145deg, #FFFFFF, #FFFDE7);
      border: 3px solid #FFE082;
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(255, 193, 7, 0.15);
      margin-bottom: 14px;
      position: relative;
    }

    .question-formula {
      font-size: 44px;
      font-weight: 900;
      color: #263238;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .answer-box {
      min-width: 90px;
      height: 64px;
      background: #FFFFFF;
      border: 4px solid #42A5F5;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #1976D2;
      padding: 0 14px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.06);
    }

    .answer-box.empty {
      color: #B0BEC5;
      border-color: #B0BEC5;
      border-style: dashed;
    }

    /* 키패드 그리드 */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .key-btn {
      background: #FFFFFF;
      border: 2px solid #CFD8DC;
      border-radius: 18px;
      height: 60px;
      font-size: 26px;
      font-weight: 900;
      color: #37474F;
      cursor: pointer;
      box-shadow: 0 4px 0 #B0BEC5;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:hover {
      background: #F5F7FA;
    }

    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #B0BEC5;
    }

    .key-btn.action-clear {
      background: #FFEBEE;
      color: #D32F2F;
      border-color: #FFCDD2;
      box-shadow: 0 4px 0 #EF9A9A;
      font-size: 19px;
      font-weight: 800;
    }

    .key-btn.action-submit {
      background: linear-gradient(135deg, #4CAF50, #43A047);
      color: white;
      border: none;
      box-shadow: 0 4px 0 #2E7D32;
      font-size: 21px;
      font-weight: 900;
    }

    .key-btn.action-submit:hover {
      background: linear-gradient(135deg, #43A047, #388E3C);
    }

    .key-btn.action-submit:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2E7D32;
    }

    /* 피드백 배너 (정답 및 오답 힌트) */
    .feedback-banner {
      min-height: 52px;
      border-radius: 16px;
      padding: 10px 16px;
      margin-top: 6px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .feedback-banner.show {
      opacity: 1;
      transform: scale(1);
    }

    .feedback-banner.correct {
      background: #E8F5E9;
      color: #2E7D32;
      border: 2px solid #A5D6A7;
    }

    .feedback-banner.incorrect {
      background: #FFF3E0;
      color: #E65100;
      border: 2px solid #FFCC80;
    }

    /* 흔들림 애니메이션 (오답 시) */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* 통통 튀는 애니메이션 (정답 시) */
    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .pop-success {
      animation: popSuccess 0.5s ease-out;
    }

    /* ===================================================
       [화면 3] 결과 화면
       =================================================== */
    .result-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .trophy-icon {
      font-size: 76px;
      margin-bottom: 12px;
      animation: bounceTrophy 1.2s infinite alternate ease-in-out;
    }

    @keyframes bounceTrophy {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-14px) scale(1.06); }
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      color: #FF6F00;
      margin-bottom: 16px;
    }

    .result-card {
      background: #FFFDE7;
      border: 3px solid #FFE082;
      border-radius: 24px;
      width: 100%;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .result-score {
      font-size: 22px;
      font-weight: 800;
      color: #37474F;
      margin-bottom: 12px;
    }

    .result-stars-box {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 14px;
      min-height: 44px;
    }

    .result-message-badge {
      display: inline-block;
      background: #FFFFFF;
      border: 2px solid #FFCA28;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 18px;
      font-weight: 800;
      color: #E65100;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 22px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-retry {
      background: linear-gradient(135deg, #42A5F5, #1E88E5);
      color: white;
      box-shadow: 0 5px 0 #1565C0;
    }

    .btn-retry:hover { transform: translateY(-2px); }
    .btn-retry:active { transform: translateY(2px); box-shadow: 0 2px 0 #1565C0; }

    .btn-change-dan {
      background: #ECEFF1;
      color: #455A64;
      box-shadow: 0 5px 0 #CFD8DC;
    }

    .btn-change-dan:hover { transform: translateY(-2px); }
    .btn-change-dan:active { transform: translateY(2px); box-shadow: 0 2px 0 #CFD8DC; }

    /* 캔버스 (폭죽 및 별 효과) */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    /* 포커스 아웃라인 제거 */
    button:focus {
      outline: none;
    }

    /* 반응형 여백 조절 */
    @media (max-width: 420px) {
      .app-container {
        border-radius: 22px;
        min-height: 590px;
      }
      .title-large {
        font-size: 26px;
      }
      .question-formula {
        font-size: 36px;
      }
      .answer-box {
        min-width: 76px;
        height: 56px;
        font-size: 34px;
      }
      .key-btn {
        height: 52px;
        font-size: 23px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 배경 축하 효과 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 상단 바 -->
    <div class="header-bar">
      <button id="btn-sound" class="icon-btn" title="소리 켜기/끄기" aria-label="소리 토글">🔊</button>
      <div id="home-btn-container" style="display: none;">
        <button id="btn-home" class="icon-btn" title="처음으로" aria-label="처음으로 이동">🏠</button>
      </div>
    </div>

    <!-- [화면 1: 단 선택 화면] -->
    <div id="screen-select" class="screen active">
      <div class="step-badge">1단계: 모험 준비 🎒</div>
      <h1 class="title-large">핑퐁 핑퐁 구구단 모험 🌟</h1>
      <p class="subtitle">연습하고 싶은 단을 선택해 보세요!</p>

      <div class="dan-grid">
        <button class="dan-btn selected" data-dan="2"><span class="dan-icon">🐰</span>2단</button>
        <button class="dan-btn" data-dan="3"><span class="dan-icon">🐱</span>3단</button>
        <button class="dan-btn" data-dan="4"><span class="dan-icon">🐶</span>4단</button>
        <button class="dan-btn" data-dan="5"><span class="dan-icon">🐼</span>5단</button>
        <button class="dan-btn" data-dan="6"><span class="dan-icon">🦊</span>6단</button>
        <button class="dan-btn" data-dan="7"><span class="dan-icon">🦁</span>7단</button>
        <button class="dan-btn" data-dan="8"><span class="dan-icon">🐯</span>8단</button>
        <button class="dan-btn" data-dan="9"><span class="dan-icon">🦄</span>9단</button>
      </div>

      <button id="btn-random-mix" class="random-btn">
        <span>🎲</span> 전체 랜덤 믹스 모험 (2~9단)
      </button>

      <button id="btn-start" class="start-btn">
        <span>🚀</span> 시작하기!
      </button>
    </div>

    <!-- [화면 2: 문제 풀이 화면] -->
    <div id="screen-quiz" class="screen">
      <!-- 진행도 & 별 점수 -->
      <div class="quiz-status-bar">
        <div id="quiz-progress" class="quiz-progress-text">문제 1 / 10</div>
        <div class="star-counter">
          <span class="star-icon">⭐</span>
          <span id="star-count">0</span>개
        </div>
      </div>

      <!-- 진행 바 -->
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <!-- 문제 카드 -->
      <div id="question-card" class="question-card">
        <div class="question-formula">
          <span id="num1">7</span>
          <span>×</span>
          <span id="num2">8</span>
          <span>=</span>
          <div id="answer-display" class="answer-box empty">?</div>
        </div>
      </div>

      <!-- 피드백 배너 -->
      <div id="feedback-banner" class="feedback-banner">
        피드백 영역
      </div>

      <!-- 숫자 키패드 -->
      <div class="keypad-grid">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn action-clear" id="key-clear">지우기 ⌫</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn action-submit" id="key-submit">확인 ✨</button>
      </div>
    </div>

    <!-- [화면 3: 결과 화면] -->
    <div id="screen-result" class="screen">
      <div class="result-container">
        <div class="trophy-icon">🏆</div>
        <h2 class="result-title">축하합니다! 구구단 탐험 성공! 🌟</h2>

        <div class="result-card">
          <div id="result-score-text" class="result-score">10문제 중 10문제 맞힘!</div>
          <div id="result-stars" class="result-stars-box">⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐</div>
          <div id="result-message" class="result-message-badge">
            구구단 마스터가 되었어요! 🎉
          </div>
        </div>

        <div class="result-actions">
          <button id="btn-replay-same" class="action-btn btn-retry">
            <span>🔁</span> 이번 단 다시 도전하기
          </button>
          <button id="btn-change-dan" class="action-btn btn-change-dan">
            <span>📋</span> 다른 단 선택하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ===================================================
       1. 오디오 신디사이저 (Web Audio API - 외부 파일 불필요)
       =================================================== */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      playClick() {
        this.playTone(480, 'triangle', 0.08, 0.15);
      }

      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        // 경쾌한 아르페지오 (도-미-솔-도)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.25, 0.25);
          }, idx * 75);
        });
      }

      playIncorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        // 부드러운 봉~ 소리
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }

      playFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const notes = [
          { f: 523.25, d: 0.15 },
          { f: 659.25, d: 0.15 },
          { f: 783.99, d: 0.15 },
          { f: 1046.50, d: 0.45 }
        ];

        let delay = 0;
        notes.forEach(n => {
          setTimeout(() => {
            this.playTone(n.f, 'triangle', n.d, 0.3);
          }, delay * 1000);
          delay += 0.12;
        });
      }
    }

    const sound = new SoundEffects();

    /* ===================================================
       2. 미니 컨페티 (색종이 꽃가루 효과)
       =================================================== */
    class ConfettiManager {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.animating = false;
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
      }

      burst(count = 35) {
        this.resize();
        const colors = ['#FF5722', '#FFCA28', '#4CAF50', '#29B6F6', '#AB47BC', '#FF4081'];
        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: this.canvas.width / 2 + (Math.random() * 80 - 40),
            y: this.canvas.height / 3,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.9) * 14,
            size: Math.random() * 8 + 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10,
            alpha: 1,
            gravity: 0.35
          });
        }

        if (!this.animating) {
          this.animating = true;
          this.update();
        }
      }

      update() {
        if (!this.animating) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vRot;
          p.alpha -= 0.012;

          if (p.alpha <= 0 || p.y > this.canvas.height + 20) {
            this.particles.splice(i, 1);
            continue;
          }

          this.ctx.save();
          this.ctx.globalAlpha = p.alpha;
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);
          this.ctx.fillStyle = p.color;
          this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          this.ctx.restore();
        }

        if (this.particles.length > 0) {
          requestAnimationFrame(() => this.update());
        } else {
          this.animating = false;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    const confetti = new ConfettiManager(document.getElementById('confetti-canvas'));

    /* ===================================================
       3. 게임 상태 및 메인 로직
       =================================================== */
    const TOTAL_QUESTIONS = 10;
    let selectedMode = '2'; // '2' ~ '9' 또는 'random'
    let currentQuestions = [];
    let currentQuizIndex = 0;
    let starsEarned = 0;
    let currentInput = '';
    let isProcessing = false;
    let hasAttemptedCurrent = false;

    // DOM 요소 캐싱
    const screenSelect = document.getElementById('screen-select');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenResult = document.getElementById('screen-result');

    const danButtons = document.querySelectorAll('.dan-btn');
    const randomBtn = document.getElementById('btn-random-mix');
    const startBtn = document.getElementById('btn-start');
    const homeBtnContainer = document.getElementById('home-btn-container');
    const homeBtn = document.getElementById('btn-home');
    const soundBtn = document.getElementById('btn-sound');

    const quizProgress = document.getElementById('quiz-progress');
    const starCount = document.getElementById('star-count');
    const progressFill = document.getElementById('progress-fill');
    const questionCard = document.getElementById('question-card');
    const num1El = document.getElementById('num1');
    const num2El = document.getElementById('num2');
    const answerDisplay = document.getElementById('answer-display');
    const feedbackBanner = document.getElementById('feedback-banner');

    const keypadButtons = document.querySelectorAll('.key-btn[data-key]');
    const keyClear = document.getElementById('key-clear');
    const keySubmit = document.getElementById('key-submit');

    const resultScoreText = document.getElementById('result-score-text');
    const resultStars = document.getElementById('result-stars');
    const resultMessage = document.getElementById('result-message');
    const btnReplaySame = document.getElementById('btn-replay-same');
    const btnChangeDan = document.getElementById('btn-change-dan');

    // 화면 전환 함수
    function showScreen(screen) {
      screenSelect.classList.remove('active');
      screenQuiz.classList.remove('active');
      screenResult.classList.remove('active');

      screen.classList.add('active');

      if (screen === screenQuiz) {
        homeBtnContainer.style.display = 'block';
      } else {
        homeBtnContainer.style.display = 'none';
      }
    }

    // 단 선택 이벤트 핸들러
    danButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        sound.playClick();
        danButtons.forEach(b => b.classList.remove('selected'));
        randomBtn.classList.remove('selected');

        btn.classList.add('selected');
        selectedMode = btn.dataset.dan;
      });
    });

    randomBtn.addEventListener('click', () => {
      sound.playClick();
      danButtons.forEach(b => b.classList.remove('selected'));
      randomBtn.classList.add('selected');
      selectedMode = 'random';
    });

    // 시작 버튼
    startBtn.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      startQuiz();
    });

    // 홈 버튼 (처음으로)
    homeBtn.addEventListener('click', () => {
      sound.playClick();
      if (confirm('현재 진행 중인 모험을 그만두고 단 선택 화면으로 갈까요?')) {
        showScreen(screenSelect);
      }
    });

    // 소리 토글 버튼
    soundBtn.addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      soundBtn.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) sound.playClick();
    });

    // 문제 세트 생성
    function generateQuestions() {
      const questions = [];

      if (selectedMode === 'random') {
        // 2~9단 골고루 무작위 추출
        while (questions.length < TOTAL_QUESTIONS) {
          const a = Math.floor(Math.random() * 8) + 2; // 2~9
          const b = Math.floor(Math.random() * 9) + 1; // 1~9
          // 중복 확인
          if (!questions.some(q => q.a === a && q.b === b)) {
            questions.push({ a, b, answer: a * b });
          }
        }
      } else {
        const dan = parseInt(selectedMode, 10);
        // 해당 단의 1~9까지 모두 포함하고, 1개는 랜덤 추가하여 총 10문제 구성
        const multipliers = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        // 셔플
        for (let i = multipliers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [multipliers[i], multipliers[j]] = [multipliers[j], multipliers[i]];
        }
        // 1개 보너스 랜덤 추가 (1~9 중 하나)
        const bonus = Math.floor(Math.random() * 9) + 1;
        multipliers.push(bonus);

        multipliers.forEach(m => {
          questions.push({ a: dan, b: m, answer: dan * m });
        });
      }

      return questions;
    }

    // 퀴즈 시작
    function startQuiz() {
      currentQuestions = generateQuestions();
      currentQuizIndex = 0;
      starsEarned = 0;
      currentInput = '';
      isProcessing = false;
      hasAttemptedCurrent = false;

      updateStarDisplay();
      showScreen(screenQuiz);
      renderCurrentQuestion();
    }

    // 현재 문제 화면 렌더링
    function renderCurrentQuestion() {
      if (currentQuizIndex >= currentQuestions.length) {
        finishQuiz();
        return;
      }

      const q = currentQuestions[currentQuizIndex];
      num1El.textContent = q.a;
      num2El.textContent = q.b;
      currentInput = '';
      hasAttemptedCurrent = false;
      isProcessing = false;

      updateAnswerDisplay();
      hideFeedback();

      quizProgress.textContent = `문제 ${currentQuizIndex + 1} / ${TOTAL_QUESTIONS}`;
      progressFill.style.width = `${((currentQuizIndex + 1) / TOTAL_QUESTIONS) * 100}%`;
    }

    // 입력값 표시 갱신
    function updateAnswerDisplay() {
      if (currentInput === '') {
        answerDisplay.textContent = '?';
        answerDisplay.classList.add('empty');
      } else {
        answerDisplay.textContent = currentInput;
        answerDisplay.classList.remove('empty');
      }
    }

    // 별 점수 갱신
    function updateStarDisplay() {
      starCount.textContent = starsEarned;
    }

    // 키패드 입력 처리
    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isProcessing) return;
        sound.playClick();
        const num = btn.dataset.key;
        if (currentInput.length < 3) { // 구구단 최대값 81이므로 최대 3자리
          currentInput += num;
          updateAnswerDisplay();
        }
      });
    });

    keyClear.addEventListener('click', () => {
      if (isProcessing) return;
      sound.playClick();
      currentInput = '';
      updateAnswerDisplay();
    });

    keySubmit.addEventListener('click', () => {
      submitAnswer();
    });

    // 키보드 입력 지원
    window.addEventListener('keydown', (e) => {
      if (!screenQuiz.classList.contains('active')) return;
      if (isProcessing) return;

      if (e.key >= '0' && e.key <= '9') {
        sound.playClick();
        if (currentInput.length < 3) {
          currentInput += e.key;
          updateAnswerDisplay();
        }
      } else if (e.key === 'Backspace') {
        sound.playClick();
        currentInput = currentInput.slice(0, -1);
        updateAnswerDisplay();
      } else if (e.key === 'Enter') {
        submitAnswer();
      }
    });

    // 정답 제출 및 판별
    function submitAnswer() {
      if (isProcessing) return;
      if (currentInput.trim() === '') {
        showFeedback(false, '답을 먼저 입력해볼까요? 😊');
        return;
      }

      const q = currentQuestions[currentQuizIndex];
      const userAnswer = parseInt(currentInput, 10);

      if (userAnswer === q.answer) {
        // [정답인 경우]
        isProcessing = true;
        sound.playCorrect();
        confetti.burst(25);

        // 첫 시도에 맞혔거나 이번 문제에서 별 획득
        if (!hasAttemptedCurrent) {
          starsEarned++;
        }
        updateStarDisplay();

        questionCard.classList.add('pop-success');
        showFeedback(true, '정답이에요! 훌륭해요! 🎉 (+1 ⭐)');

        setTimeout(() => {
          questionCard.classList.remove('pop-success');
          currentQuizIndex++;
          renderCurrentQuestion();
        }, 1200);

      } else {
        // [오답인 경우] - 긍정적 격려와 힌트 제공
        hasAttemptedCurrent = true;
        sound.playIncorrect();

        questionCard.classList.add('shake');
        setTimeout(() => questionCard.classList.remove('shake'), 400);

        // 친절한 힌트 메시지 생성 (예: 7을 8번 더해봐요)
        const hintText = `아쉬워요! 다시 한번 생각해볼까요? 힘내요! 💪<br><span style="font-size: 14px; color: #D84315;">💡 힌트: ${q.a}를 ${q.b}번 더해보세요!</span>`;
        showFeedback(false, hintText);

        // 정답을 다시 입력할 수 있도록 입력창 비우기
        currentInput = '';
        updateAnswerDisplay();
      }
    }

    // 피드백 배너 표시
    function showFeedback(isCorrect, message) {
      feedbackBanner.className = 'feedback-banner show ' + (isCorrect ? 'correct' : 'incorrect');
      feedbackBanner.innerHTML = message;
    }

    function hideFeedback() {
      feedbackBanner.className = 'feedback-banner';
      feedbackBanner.innerHTML = '';
    }

    /* ===================================================
       4. 결과 화면
       =================================================== */
    function finishQuiz() {
      showScreen(screenResult);
      sound.playFanfare();
      confetti.burst(60);

      resultScoreText.textContent = `${TOTAL_QUESTIONS}문제 중 ${starsEarned}문제 맞힘!`;

      // 별 아이콘 나열
      let starStr = '';
      for (let i = 0; i < starsEarned; i++) {
        starStr += '⭐';
      }
      for (let i = starsEarned; i < TOTAL_QUESTIONS; i++) {
        starStr += '☆';
      }
      resultStars.textContent = starStr;

      // 평가 메시지
      if (starsEarned >= 8) {
        resultMessage.textContent = '구구단 마스터가 되었어요! 👑';
      } else if (starsEarned >= 5) {
        resultMessage.textContent = '조금만 더 연습하면 마스터가 될 수 있어요! 🌟';
      } else {
        resultMessage.textContent = '차근차근 연습하면 실력이 쑥쑥 늘어요! 화이팅! 💖';
      }
    }

    // 같은 단 다시 도전
    btnReplaySame.addEventListener('click', () => {
      sound.playClick();
      startQuiz();
    });

    // 다른 단 선택하기
    btnChangeDan.addEventListener('click', () => {
      sound.playClick();
      showScreen(screenSelect);
    });
  </script>
</body>
